# Proposed synthetic parameter set (SYN-PAR-06), read by O2-O4 and copied into every input set.
#
# STATUS: PROPOSED. Every value below was chosen by Claude Code as a working assumption so the
# engine can run end to end; none is owner-approved, estimated or EBA-prescribed. The project
# owner replaces or approves them (requirements section 1.5 item 1, docs/architecture.md section 6 item 1). See
# docs/assumptions.md for the reasoning behind each choice.
#
# Units: rates, probabilities and driver values are decimal fractions (0.015 = 1.5%).
# Values that come from the spec (CCFs, tolerances, horizon years) are filled in by O3 from
# docs/spec/ and are not repeated here.

parameter_set_id: SYN-PS-0.1-proposed
version: "0.1"
status: PROPOSED

# Shared master scale (PD-09, D13): N = 10 performing grades plus D. The one-year TTC PD of
# each grade is the D column of every segment's TTC matrix. The rungs were set so that each
# section 8.7 target lies between two grades inside the section 5.4 PD range of its portfolio.
master_scale:
  grades: [G1, G2, G3, G4, G5, G6, G7, G8, G9, G10]
  default_grade: D
  ttc_pd: [0.0002, 0.0005, 0.0012, 0.0030, 0.0070, 0.0160, 0.0300, 0.0480, 0.0900, 0.1800]

# Migration shape of the TTC matrices (O2): the non-default mass of a row stays in its grade
# with probability `stay`; the rest moves, `downgrade_share` of it downwards, each further notch
# `decay` times as likely as the one before.
migration:
  P01: {stay: 0.90, downgrade_share: 0.55, decay: 0.30}
  P02: {stay: 0.80, downgrade_share: 0.55, decay: 0.30}
  P03: {stay: 0.82, downgrade_share: 0.55, decay: 0.30}
  P04: {stay: 0.85, downgrade_share: 0.55, decay: 0.30}
  P05: {stay: 0.85, downgrade_share: 0.55, decay: 0.30}
  P06_GG: {stay: 0.92, downgrade_share: 0.55, decay: 0.30}
  P06_CI: {stay: 0.90, downgrade_share: 0.55, decay: 0.30}

# Portfolios and their segments (SYN-PAR-06, MOD-01). Each segment names its three models:
# functions in the engine's src/stress/models/<portfolio>.py, which hold their own coefficients
# (drivers, betas, means and standard deviations, and the LGD and prepayment sensitivities).
# A segment may only use models of its own portfolio. O3 adds each segment's TTC matrix file
# (matrices/<segment>.parquet, written by O2) and its CCF from the spec.
portfolios:
  P01:
    segments:
      P01:
        pd_model: p01.pd
        lgd_model: p01.lgd
        prepayment_model: p01.prepayment
        asset_correlation: 0.15  # matrix correlation rho (PD-10)
        sicr_k: 2.5              # SICR multiple, a test convention (MIG-05, MIG-07)
        cpr_ttc: 0.06            # TTC prepayment rate (EAD-11)
  P02:
    segments:
      P02:
        pd_model: p02.pd
        lgd_model: p02.lgd
        prepayment_model: p02.prepayment
        asset_correlation: 0.06
        sicr_k: 2.0
        cpr_ttc: 0.10
  P03:
    segments:
      P03:
        pd_model: p03.pd
        lgd_model: p03.lgd
        prepayment_model: p03.prepayment
        asset_correlation: 0.12
        sicr_k: 2.5
        cpr_ttc: 0.05
  P04:
    segments:
      P04:
        pd_model: p04.pd
        lgd_model: p04.lgd
        prepayment_model: p04.prepayment
        asset_correlation: 0.15
        sicr_k: 2.5
        cpr_ttc: 0.03
  P05:
    segments:
      P05:
        pd_model: p05.pd
        lgd_model: p05.lgd
        prepayment_model: p05.prepayment
        asset_correlation: 0.12
        sicr_k: 2.5
        cpr_ttc: 0.05
  P06:
    segments:
      P06_GG:
        pd_model: p06.gg_pd
        lgd_model: p06.gg_lgd
        prepayment_model: p06.gg_prepayment
        asset_correlation: 0.20
        sicr_k: 3.0
        cpr_ttc: 0.0
      P06_CI:
        pd_model: p06.ci_pd
        lgd_model: p06.ci_lgd
        prepayment_model: p06.ci_prepayment
        asset_correlation: 0.20
        sicr_k: 3.0
        cpr_ttc: 0.0

# Terminal rule (ECL-10, D5): adverse Z reverts linearly to baseline 2029 over six years,
# baseline stays flat; S1 at the end of the horizon interpolates the loss rate (AT-06).
terminal_rule:
  method: linear_reversion_to_baseline
  # reversion_years and last_scenario_year are read from the spec (ECL-10, AT-52) by O3.
  baseline: flat
  s1_end_of_horizon: loss_rate_interpolation
  # Z is extended to this year; a facility needing a later bucket blocks (AT-41).
  last_bucket_year: 2060

conventions:
  sicr_horizon: remaining_life_at_opening      # A6: owner input "SICR horizon"
  stub_pd: constant_hazard_by_grade            # A7: owner input "PD for a stub final bucket"
  default_buckets: calendar_year_end           # SYN-PAR-07
  new_s3_undrawn: off_balance_flow_ccf_lgd     # A9: owner input "undrawn part of a new S3 cohort"
  opening_allowance_matrix: ttc                # A8: architecture section 6 item 3
  opening_allowance_schedule: bullet           # A8: SYN-PAR-09 and D8

# Qualitative SICR triggers (MIG-05; owner decision of 18 October 2026, A30). A performing
# facility is S2 when any switched-on trigger holds, whatever its grade, and the flag holds it
# in S2 until it defaults (option (a)). Each switched-on trigger needs a source definition, and
# every facility carries the observation date of its flags (section 4.2, credit status).
sicr_triggers:
  enabled: [dpd, watchlist, forborne]
  dpd_days: 30                                 # the 30+ days past due backstop
  hold: until_default
  definitions:
    dpd: days past due on the facility's contractual payments at the observation date
    watchlist: on the bank's credit watchlist at the observation date
    forborne: a forbearance measure in place at the observation date (forborne exposure)
  source: synthetic, set by the generator O3 (foundation/synth) and observed at the snapshot date

# Variants (section 8.7 SYN-PAR-07). Core is bullet for every facility. The
# amortising variants change the profile of amortising products only; revolvers and debt
# securities stay bullet. The utilisation variant is the AT-35 CCF sensitivity.
variants:
  core:
    label: Core reference run (bullet, fixed CCF)
    repayment_profile: {default: bullet}
    ccf: {}
  annuity:
    label: Annuity repayment for amortising products
    repayment_profile: {mortgage: annuity, consumer_loan: annuity, term_loan: annuity, default: bullet}
    ccf: {}
  linear:
    label: Linear repayment for amortising products
    repayment_profile: {mortgage: linear, consumer_loan: linear, term_loan: linear, default: bullet}
    ccf: {}
  utilisation:
    label: AT-35 utilisation sensitivity
    repayment_profile: {default: bullet}
    # O3 replaces "AT-35" by the CCF the AT-35 oracle rises to, for every book with commitments.
    ccf: {P03: AT-35, P05: AT-35}
