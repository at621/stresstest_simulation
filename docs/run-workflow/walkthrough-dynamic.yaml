# Worked example for the workflow page. Illustrative values: not estimates, not a forecast.
schema_version: 1
status: SYNTHETIC
source: "Workflow walkthrough, 31 October 2026. Illustrative values."
version: walkthrough-v1
input_set_hash: d62d0386f2c5256eb50fbc787678fdc420fc5bda42ab5f8100a147d097dc91ee

run:
  inputs: ../../inputs/d62d0386f2c5256e
  scenarios: [baseline, adverse, energy_crisis]
  variant: core
  balance_sheet: dynamic
# The crisis: everything comes from adverse except the cells named here.
scenarios:
  energy_crisis:
    inherits: adverse
    narrative: "Energy shock: deeper recession and higher rates than adverse."
    overrides:
      - {variable: gdp_growth, country: '*', year: 2027, value: -0.08, unit: decimal, value_type: growth}
      - {variable: gdp_growth, country: '*', year: 2028, value: -0.04, unit: decimal, value_type: growth}
      - {variable: reference_rate, country: '*', year: 2027, value: 0.06, unit: decimal, value_type: level}

# A driver the base scenarios do not have. Every scenario in the run needs it.
additional_values:
  - {scenario: baseline, country: '*', variable: energy_price_change, year: 2027, value: 0.03, unit: decimal, value_type: growth}
  - {scenario: baseline, country: '*', variable: energy_price_change, year: 2028, value: 0.03, unit: decimal, value_type: growth}
  - {scenario: baseline, country: '*', variable: energy_price_change, year: 2029, value: 0.03, unit: decimal, value_type: growth}
  - {scenario: adverse, country: '*', variable: energy_price_change, year: 2027, value: 0.10, unit: decimal, value_type: growth}
  - {scenario: adverse, country: '*', variable: energy_price_change, year: 2028, value: 0.06, unit: decimal, value_type: growth}
  - {scenario: adverse, country: '*', variable: energy_price_change, year: 2029, value: 0.03, unit: decimal, value_type: growth}
  - {scenario: energy_crisis, country: '*', variable: energy_price_change, year: 2027, value: 0.60, unit: decimal, value_type: growth}
  - {scenario: energy_crisis, country: '*', variable: energy_price_change, year: 2028, value: 0.25, unit: decimal, value_type: growth}
  - {scenario: energy_crisis, country: '*', variable: energy_price_change, year: 2029, value: 0.00, unit: decimal, value_type: growth}

# The models. Each one must be attached to a segment below.
models:
  consumer_nonlinear:
    kind: polynomial
    source: "Illustrative coefficients"
    version: walkthrough-v1
    terms:
      activity: {variable: gdp_growth, mean: 0.02, sd: 0.03, beta: 0.6}
      activity_squared: {variable: gdp_growth, mean: 0.02, sd: 0.03, beta: -0.08, power: 2}
      unemployment: {variable: unemployment, mean: 0.07, sd: 0.025, beta: -0.3}
  energy_sector:
    kind: linear
    source: "Illustrative coefficients"
    version: walkthrough-v1
    drivers:
      gdp_growth: {beta: 0.5, mean: 0.015, sd: 0.03}
      energy_price_change: {beta: -0.5, mean: 0.03, sd: 0.15}
  cre_external:
    kind: supplied
    source: "Illustrative scores standing in for an external CRE model"
    version: walkthrough-v1
    values:
        - {scenario: baseline, country: DE, year: 2027, z: 0.00}
