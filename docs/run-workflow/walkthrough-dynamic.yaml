# The links: segment -> model. Segments not listed keep their base z_drivers.
segments:
  P02:
    macro_model: consumer_nonlinear
  P04:
    macro_model: cre_external
  P05_ENERGY:
    inherits: P05
    portfolio: P07
    macro_model: energy_sector
    template_class: "Loans and advances - NFC - Energy sector (walkthrough label)"

# Move NACE D out of P05 into the new segment and a new reporting portfolio.
assignments:
  - where: {portfolio: P05, nace_code: D}
    segment: P05_ENERGY
    portfolio: P07

# The crisis fades to baseline in 3 years instead of the base rule's 6.
terminal_policies:
  energy_crisis: {method: reversion, years: 3}

# Dynamic volumes: one row per scenario, year and portfolio (3 x 3 x 7 = 63).
balance_sheet:
