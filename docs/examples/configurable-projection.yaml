# Illustrative synthetic experiment; these paths and coefficients are not estimates.
schema_version: 1
status: SYNTHETIC
source: "Configurable projection demonstration, 31 October 2026"
version: demo-v1
input_set_hash: 57bf340df85d5a5425789efdfd6fe56ce4e532f3667b4672bed07c007cbf00c6
run:
  inputs: ../../inputs/57bf340df85d5a54
  scenarios: [baseline, adverse, energy_crisis]
  variant: core
  balance_sheet: dynamic
scenarios:
  energy_crisis:
    inherits: adverse
    narrative: "Illustrative energy shock: weaker activity and higher rates, with faster performing-book contraction."
    overrides:
      - {variable: gdp_growth, country: '*', year: 2027, value: -0.08, unit: decimal, value_type: growth}
      - {variable: gdp_growth, country: '*', year: 2028, value: -0.04, unit: decimal, value_type: growth}
      - {variable: reference_rate, country: '*', year: 2027, value: 0.06, unit: decimal, value_type: level}
# P02 points its three models at the illustrative nonlinear functions in src/stress/models/p02.py.
segments:
  P02:
    pd_model: p02.pd_nonlinear
    lgd_model: p02.lgd_nonlinear
    prepayment_model: p02.prepayment_nonlinear
terminal_policies:
  energy_crisis: {method: flat}
