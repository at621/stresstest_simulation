[project]
name = "stress-engine"
version = "0.1.0"
description = "Credit stress-test engine for EBA 2027 preparation (EUR only, amortised cost, no climate)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
stress = "stress.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "import-linter>=2.0",
    "hypothesis>=6.170.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]

[tool.uv]
# A plain `uv sync` removes packages outside its groups, so the notebook kernel is kept by default.
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stress", "foundation"]

# archive/ is off-limits to Claude Code, and inputs/ and runs/ hold data, so no tool scans them.

[tool.ruff]
line-length = 100
cache-dir = "tests/.ruff_cache"  # tool caches stay out of the repository root
src = ["src", ".", "tests", "notebooks"]
extend-exclude = ["archive", "inputs", "runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tests/.pytest_cache"
pythonpath = ["src", "."]
norecursedirs = ["archive", "inputs", "runs", ".*"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "at(id): acceptance case this test proves, e.g. at('AT-25')",
    "req(*ids): requirement IDs this test proves, e.g. req('PD-03')",
    "control(name): requirements section 12.2 control this test proves",
]

# Architecture contracts, checked with `lint-imports --cache-dir tests/.import_linter_cache` (import-linter takes its cache
# folder only on the command line).

[tool.importlinter]
root_packages = ["stress", "foundation"]

[[tool.importlinter.contracts]]
name = "The engine imports nothing from the one-off steps"
type = "forbidden"
source_modules = ["stress"]
forbidden_modules = ["foundation"]

[[tool.importlinter.contracts]]
name = "The one-off steps import nothing from the engine"
type = "forbidden"
source_modules = ["foundation"]
forbidden_modules = ["stress"]

[[tool.importlinter.contracts]]
name = "Pipeline steps share only contracts; cli wires them"
type = "layers"
layers = [
    "stress.cli",
    "stress.lineage | stress.ingest | stress.validate | stress.scenario | stress.cashflows | stress.params | stress.projection | stress.ecl | stress.accounting | stress.report | stress.capital",
    "stress.contracts",
]
