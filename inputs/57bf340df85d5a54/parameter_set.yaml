terminal_rule:
  method: linear_reversion_to_baseline
  baseline: flat
  s1_end_of_horizon: loss_rate_interpolation
  last_scenario_year: 2029
  reversion_years: 6
conventions:
  sicr_horizon: remaining_life_at_opening
  stub_pd: constant_hazard_by_grade
  default_buckets: calendar_year_end
  new_s3_undrawn: off_balance_flow_ccf_lgd
  opening_allowance_matrix: ttc
  opening_allowance_schedule: bullet
sicr_triggers:
  enabled:
  - dpd
  - watchlist
  - forborne
  dpd_days: 30
  hold: until_default
  definitions:
    dpd: days past due on the facility's contractual payments at the observation date
    watchlist: on the bank's credit watchlist at the observation date
    forborne: a forbearance measure in place at the observation date (forborne exposure)
  source: synthetic, set by the generator O3 (foundation/synth) and observed at the snapshot date
tolerances:
  counts:
    kind: exact
  probability_identity:
    kind: abs
    abs: 1.0e-10
  rate:
    kind: abs
    abs: 1.0e-10
  amount:
    kind: abs
    abs: 0.01
  aggregate:
    kind: max_abs_rel
    abs: 1.0
    rel: 1.0e-08
variants:
  core:
    label: Core reference run (bullet, fixed CCF)
    repayment_profile:
      default: bullet
    ccf: {}
  annuity:
    label: Annuity repayment for amortising products
    repayment_profile:
      mortgage: annuity
      consumer_loan: annuity
      term_loan: annuity
      default: bullet
    ccf: {}
  linear:
    label: Linear repayment for amortising products
    repayment_profile:
      mortgage: linear
      consumer_loan: linear
      term_loan: linear
      default: bullet
    ccf: {}
  utilisation:
    label: AT-35 utilisation sensitivity
    repayment_profile:
      default: bullet
    ccf:
      P03: 0.75
      P05: 0.75
