scenario_set_id: SYN-SCN-1.3
source: requirements v1.3 section 6.2 (illustrative common paths); foundation/scenarios.yaml (illustrative
  synthetic paths)
release: '2026-11-06'
revision: 2
status: SYNTHETIC
scenarios:
- id: baseline
  label: Baseline
  description: Steady growth of 1.5% to 1.8% a year, unemployment easing from 6.0% to 5.7%, property prices
    up 2% to 3% a year and the reference rate drifting down from 2.5%.
  status: SYNTHETIC
  source_type: synthetic
- id: adverse
  label: Adverse
  description: 'A recession: GDP falls 3.0% in 2027 and 2.0% in 2028, unemployment rises to 9.2%, house
    prices fall 23% and CRE prices 29% over three years, and the reference rate peaks at 4.5%.'
  status: SYNTHETIC
  source_type: synthetic
- id: severe_adverse
  label: Severe adverse
  description: 'A deeper and longer recession: GDP falls 5.0% in 2027 and 3.5% in 2028, unemployment rises
    to 11.0%, house prices fall 31% and CRE prices 38% over three years, and the reference rate peaks
    at 5.0%.'
  status: SYNTHETIC
  source_type: synthetic
- id: rates_shock
  label: Rates shock
  description: 'Persistent inflation pushes the reference rate to 6.5% in 2028 while growth stalls: GDP
    falls 1.0% in 2027, unemployment rises to 7.8%, house prices fall 12% and CRE prices 20% over three
    years.'
  status: SYNTHETIC
  source_type: synthetic
- id: property_crash
  label: Property crash
  description: 'Property prices collapse while the wider economy holds up: house prices fall 35% and CRE
    prices 43% over three years, GDP dips 1.5% in 2027, unemployment peaks at 7.4% and the reference rate
    follows the baseline.'
  status: SYNTHETIC
  source_type: synthetic
